[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apifox-mcp-server"
version = "1.0.0"
description = "MCP servers for Apifox API management platform"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Apifox MCP Contributors" }
]
keywords = [
    "apifox",
    "mcp",
    "model-context-protocol",
    "api-management",
    "openapi",
    "swagger",
    "ai-assistant"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
yaml = [
    "pyyaml>=6.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "black>=23.0",
    "isort>=5.12",
    "flake8>=6.0",
    "mypy>=1.0",
    "pre-commit>=3.0",
]
all = [
    "apifox-mcp-server[yaml,dev]",
]

[project.urls]
Homepage = "https://github.com/apifox/apifox-mcp-server"
Documentation = "https://github.com/apifox/apifox-mcp-server#readme"
Repository = "https://github.com/apifox/apifox-mcp-server.git"
Issues = "https://github.com/apifox/apifox-mcp-server/issues"
Changelog = "https://github.com/apifox/apifox-mcp-server/blob/main/CHANGELOG.md"

[project.scripts]
apifox-cli-mcp = "apifox_cli_mcp.server:main"
apifox-api-mcp = "apifox_api_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["apifox_cli_mcp", "apifox_api_mcp"]

[tool.black]
line-length = 120
target-version = ['py310']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 120

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["apifox_cli_mcp", "apifox_api_mcp"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
